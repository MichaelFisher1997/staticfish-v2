<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background shapes -->
  <rect x="30" y="200" width="80" height="80" fill="currentColor" fill-opacity="0.02"/>
  <rect x="300" y="30" width="80" height="80" fill="#D94E2B" fill-opacity="0.04"/>
  
  <!-- Editor sidebar -->
  <rect x="50" y="50" width="90" height="200" stroke="currentColor" stroke-width="2" fill="white"/>
  <rect x="50" y="50" width="90" height="30" fill="currentColor" fill-opacity="0.05"/>
  
  <!-- Sidebar items -->
  <rect x="65" y="95" width="60" height="6" fill="currentColor" fill-opacity="0.08"/>
  <rect x="65" y="112" width="45" height="6" fill="currentColor" fill-opacity="0.05"/>
  <rect x="65" y="129" width="55" height="6" fill="currentColor" fill-opacity="0.05"/>
  <rect x="65" y="146" width="40" height="6" fill="currentColor" fill-opacity="0.05"/>
  
  <!-- Main editor area -->
  <rect x="150" y="50" width="200" height="200" stroke="currentColor" stroke-width="2" fill="white"/>
  
  <!-- Toolbar -->
  <rect x="150" y="50" width="200" height="32" fill="currentColor" fill-opacity="0.03"/>
  <rect x="165" y="63" width="18" height="8" fill="currentColor" fill-opacity="0.1"/>
  <rect x="190" y="63" width="18" height="8" fill="currentColor" fill-opacity="0.1"/>
  <rect x="215" y="63" width="18" height="8" fill="currentColor" fill-opacity="0.1"/>
  <rect x="300" y="63" width="35" height="8" fill="#D94E2B" fill-opacity="0.15"/>
  
  <!-- Content blocks -->
  <rect x="165" y="100" width="170" height="12" fill="currentColor" fill-opacity="0.07"/>
  <rect x="165" y="125" width="130" height="8" fill="currentColor" fill-opacity="0.05"/>
  <rect x="165" y="140" width="150" height="8" fill="currentColor" fill-opacity="0.05"/>
  
  <!-- Image block -->
  <rect x="165" y="165" width="90" height="60" fill="currentColor" fill-opacity="0.04"/>
  <rect x="175" y="175" width="70" height="40" fill="#D94E2B" fill-opacity="0.08"/>
  
  <!-- Text beside image -->
  <rect x="270" y="165" width="70" height="5" fill="currentColor" fill-opacity="0.05"/>
  <rect x="270" y="178" width="55" height="5" fill="currentColor" fill-opacity="0.04"/>
  <rect x="270" y="191" width="60" height="5" fill="currentColor" fill-opacity="0.04"/>
  
  <!-- Floating edit indicator -->
  <rect x="320" y="210" width="55" height="55" fill="#D94E2B" fill-opacity="0.08" stroke="#D94E2B" stroke-width="1.5"/>
  <rect x="335" y="228" width="25" height="3" fill="#D94E2B" fill-opacity="0.5"/>
  <rect x="335" y="238" width="18" height="3" fill="#D94E2B" fill-opacity="0.3"/>
</svg>