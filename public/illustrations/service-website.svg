<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background grid pattern -->
  <rect x="20" y="20" width="100" height="100" fill="currentColor" fill-opacity="0.02"/>
  <rect x="280" y="180" width="100" height="100" fill="#D94E2B" fill-opacity="0.04"/>
  
  <!-- Main browser -->
  <rect x="60" y="40" width="280" height="220" stroke="currentColor" stroke-width="2.5" fill="white"/>
  
  <!-- Header -->
  <rect x="60" y="40" width="280" height="35" fill="currentColor" fill-opacity="0.05"/>
  <circle cx="85" cy="57" r="5" fill="currentColor" fill-opacity="0.12"/>
  <circle cx="105" cy="57" r="5" fill="currentColor" fill-opacity="0.12"/>
  <circle cx="125" cy="57" r="5" fill="currentColor" fill-opacity="0.12"/>
  
  <!-- Hero content -->
  <rect x="80" y="95" width="160" height="18" fill="currentColor" fill-opacity="0.08"/>
  <rect x="80" y="125" width="120" height="10" fill="currentColor" fill-opacity="0.05"/>
  <rect x="80" y="142" width="140" height="10" fill="currentColor" fill-opacity="0.05"/>
  
  <!-- Image placeholder -->
  <rect x="80" y="165" width="100" height="70" fill="currentColor" fill-opacity="0.04"/>
  <rect x="90" y="175" width="80" height="50" fill="#D94E2B" fill-opacity="0.1"/>
  
  <!-- Text column -->
  <rect x="195" y="165" width="120" height="6" fill="currentColor" fill-opacity="0.05"/>
  <rect x="195" y="178" width="100" height="6" fill="currentColor" fill-opacity="0.04"/>
  <rect x="195" y="191" width="110" height="6" fill="currentColor" fill-opacity="0.04"/>
  <rect x="195" y="204" width="80" height="6" fill="currentColor" fill-opacity="0.04"/>
  
  <!-- CTA button -->
  <rect x="80" y="250" width="70" height="24" fill="#D94E2B" fill-opacity="0.85"/>
  <rect x="92" y="260" width="30" height="4" fill="white" fill-opacity="0.8"/>
  
  <!-- Decorative corner -->
  <rect x="330" y="40" width="30" height="30" fill="#D94E2B" fill-opacity="0.1"/>
</svg>